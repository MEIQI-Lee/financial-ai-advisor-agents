[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "financial-ai-advisor-agents"
version = "0.1.0"
description = "Independent educational multi-agent financial advisor reimplementation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Meiqi Li"}]
license = {file = "LICENSE"}
dependencies = [
  "matplotlib>=3.8",
  "openai>=1.40",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "sqlglot>=25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
finagent = "financial_ai_advisor_agents.cli:main"

[project.urls]
Homepage = "https://github.com/MEIQI-Lee/financial-ai-advisor-agents"
Repository = "https://github.com/MEIQI-Lee/financial-ai-advisor-agents.git"
Issues = "https://github.com/MEIQI-Lee/financial-ai-advisor-agents/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_ai_advisor_agents"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "financial_ai_advisor_agents/resources/configs"
"prompts" = "financial_ai_advisor_agents/resources/prompts"
"data/mock" = "financial_ai_advisor_agents/resources/data/mock"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["financial_ai_advisor_agents"]
